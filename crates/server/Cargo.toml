[package]
name = "oxicache-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-memory cache server (TCP and HTTP front ends) using S3-FIFO eviction"

[dependencies]
oxicache-wire.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
thiserror.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rapidhash = { version = "4.5", default-features = false, features = ["std"] }
parking_lot = "0.12"
crossbeam-epoch = "0.9"
socket2 = "0.6"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
