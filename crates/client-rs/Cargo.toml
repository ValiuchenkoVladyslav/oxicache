[package]
name = "oxicache-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TCP client for oxicache"

[[bin]]
name = "oxicache-cli"
path = "src/main.rs"

[dependencies]
oxicache-wire.workspace = true
bytes.workspace = true
tokio.workspace = true
thiserror.workspace = true
clap.workspace = true
serde = { version = "1", optional = true }

[features]
## Typed API: `get_typed`, `set_typed`, `del_typed` accept any `Serialize` key
## or value and decode responses into any `DeserializeOwned` type.
serde = ["dep:serde"]

[dev-dependencies]
oxicache-server.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
