[workspace]
resolver = "3"
members = ["crates/wire", "crates/server", "crates/client-rs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"

# Only what more than one crate uses; each crate adds the tokio features it needs.
[workspace.dependencies]
oxicache-wire = { path = "crates/wire" }
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
