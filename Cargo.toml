[workspace]
resolver = "3"
members = ["crates/wire", "crates/server", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
oxicache-wire = { path = "crates/wire" }
oxicache-server = { path = "crates/server" }
oxicache-client = { path = "crates/client" }

bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
rcgen = "0.14"
http = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
foldhash = "0.2"
parking_lot = "0.12"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
