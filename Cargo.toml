[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"

# Only what more than one crate uses; each crate adds the tokio features it needs.
[workspace.dependencies]
oxicache-wire = { path = "crates/wire" }
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
